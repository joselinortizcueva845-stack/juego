<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piedra, Papel o Tijera con IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🤖 Piedra, Papel o Tijera IA</h1>
  
  <div class="marcador">
    Tú: <span id="puntos-jugador">0</span> | IA: <span id="puntos-ia">0</span>
  </div>

  <div class="contenedor">
    <!-- Lado del Jugador -->
    <div class="caja">
      <h3>Tu Cámara</h3>
      <div id="webcam-container"></div>
      <p>Detectando: <strong id="deteccion-actual">Cargando...</strong></p>
    </div>

    <!-- Lado de la IA -->
    <div class="caja">
      <h3>Computadora</h3>
      <div class="emoji-ia" id="ia-eleccion">❓</div>
      <p>Elección: <strong id="ia-texto">Esperando</strong></p>
    </div>
  </div>

  <div id="estado">Presiona "Jugar Ronda" para iniciar</div>
  <button id="btn-jugar" disabled>Cargando modelo...</button>

  <!-- Librerías de TensorFlow.js y Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  
  <!-- Tu archivo JavaScript -->
  <script src="app.js"></script>
</body>
</html>
